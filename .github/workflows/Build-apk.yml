name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Clé de signature (mode mise à jour)
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::Fichier debug.keystore absent à la racine du dépôt. Ajoutez-le pour pouvoir installer les mises à jour par-dessus."
            exit 1
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -keystore debug.keystore -storepass android | tail -1

      - name: Installer les dépendances
        run: npm install

      - name: Télécharger jsPDF (fonctionnement hors ligne)
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js

      - name: Créer le projet Android et ajouter l'envoi MMS automatique
        run: |
          npx cap add android
          bash native/patch-android.sh
          npx cap sync android

      - name: Numéro de version (augmente à chaque construction)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PREJ-Missions-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

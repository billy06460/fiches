name: Build Android APK

# Se declenche automatiquement a chaque envoi sur la branche "main",
# et peut aussi etre lance manuellement depuis l'onglet Actions de GitHub.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Le SDK Android est deja preinstalle sur les machines GitHub (ubuntu-latest),
      # avec les licences deja acceptees : pas besoin d'etape supplementaire ici.
      # (une etape "setup-android" supplementaire a deja cause un echec par le passe
      #  car elle tentait de telecharger un composant "tools" obsolete)

      - name: Installer les dependances npm
        run: npm install

      - name: DEBUG - verifier le contenu de package.json et node_modules
        run: |
          echo "--- package.json tel que vu par le job ---"
          cat package.json
          echo ""
          echo "--- contenu de node_modules/@capawesome (si present) ---"
          ls -la node_modules/@capawesome/ 2>&1 || echo "DOSSIER @capawesome INTROUVABLE"
          echo ""
          echo "--- package.json du plugin mail-composer (si present) ---"
          cat node_modules/@capawesome/capacitor-mail-composer/package.json 2>&1 || echo "PACKAGE.JSON DU PLUGIN INTROUVABLE"

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Generer l'icone de l'app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Synchroniser le code web et les plugins natifs
        run: npx cap sync android

      - name: Autoriser l'execution de gradlew
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Mettre l'APK a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-bord-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

